server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: serviceflow
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    banner-mode: off
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  schedule:
    # 定时任务开关与执行周期（Cron 表达式）
    auto-confirm-cron: ${APP_AUTO_CONFIRM_CRON:0 0/10 * * * ?}
    overdue-reminder-cron: ${APP_OVERDUE_REMINDER_CRON:0 0 * * * ?}
  jwt:
    issuer: serviceflow
    # 生产环境必须通过环境变量 JWT_SECRET 注入；留空时启动会生成一次性随机密钥
    secret: ${JWT_SECRET:}
    access-token-minutes: 120
    refresh-token-days: 7
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  upload:
    # 附件本地存储目录，必须位于仓库之外或已被 .gitignore 排除
    dir: ${APP_UPLOAD_DIR:./storage/attachments}

logging:
  level:
    root: info
    com.serviceflow: debug
