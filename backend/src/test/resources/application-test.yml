spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 测试库与开发库分离，避免集成测试污染开发数据
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:serviceflow_test}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

logging:
  level:
    root: warn
    com.serviceflow: info

app:
  schedule:
    # 测试中不启动定时任务，改为直接调用服务方法验证
    auto-confirm-cron: "-"
    overdue-reminder-cron: "-"
  jwt:
    issuer: serviceflow-test
    # 仅用于自动化测试，生产环境必须通过 JWT_SECRET 环境变量注入真实密钥
    secret: serviceflow-integration-test-only-secret-key-32bytes
